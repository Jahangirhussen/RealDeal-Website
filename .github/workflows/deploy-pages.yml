name: Deploy 3 branches to GitHub Pages

on:
  push:
    branches: [realdeal_minimal_service, final_4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/checkout@v4
        with: { ref: jahangir-dev, path: jahangir-dev }
      - uses: actions/checkout@v4
        with: { ref: realdeal_minimal_service, path: realdeal_minimal_service }
      - uses: actions/checkout@v4
        with: { ref: final_4, path: final_4 }
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main site/main
          cp -r jahangir-dev site/jahangir-dev
          cp -r realdeal_minimal_service site/realdeal_minimal_service
          cp -r final_4 site/final_4
          cat > site/index.html << 'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>RealDeal_Home — Branch Previews</title>
          <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#0e1a24}
          a{display:block;padding:14px 18px;margin:10px 0;border:1px solid #ddd;border-radius:8px;text-decoration:none;color:#0e1a24}
          a:hover{border-color:#ff4a1c}</style></head><body>
          <h1>RealDeal_Home — Branch Previews</h1>
          <a href="main/realdeal-home-white.html"><strong>main</strong> — production branch</a>
          <a href="jahangir-dev/realdeal-home-white.html"><strong>jahangir-dev</strong> — development branch</a>
          <a href="realdeal_minimal_service/realdeal-home-white.html"><strong>realdeal_minimal_service</strong> — cleaned 4-category service structure</a>
          <a href="final_4/realdeal-home-white.html"><strong>final_4</strong> — Portfolio, Blog and mobile fixes</a>
          </body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
